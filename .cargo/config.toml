[alias]
xtask = "run -p xtask --"

# getrandom 0.3 (via chisel-audit -> oauth-toolkit/tokenkit) requires this
# configuration flag on wasm32-unknown-unknown: the wasm_js backend
# (crypto.getRandomValues). Native targets are unaffected.
# The wasm_js cargo feature is unified via pdfcraft-audit's target table.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
