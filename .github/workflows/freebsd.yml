# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
#
# CHISEL FORK: manual-only. The job delegates to `craft-common-actions`, which is
# upstream-PRIVATE (404 to GitHub) and therefore unreachable from the fork — running
# it on every push would be a guaranteed red. Vendoring the shared workflows
# (freebsd / packaging-lint / release) into this repo is the W3–6 ticket; until then
# the definition stays here, reviewable, but only dispatchable by hand.
name: FreeBSD

on:
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: wyattau/craft-common-actions/.github/workflows/freebsd.yml@main
    with:
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
