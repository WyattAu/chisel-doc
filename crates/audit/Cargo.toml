[package]
name = "pdfcraft-audit"
description = "Verification tooling: audit documents for faux redactions (opaque covers over extractable text)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-edit = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }

# platform dogfood pin (exact rev): the tamper-evident trail for applied redactions.
# Optional because tamper-audit's uuid IDs do not compile on wasm32 yet (no
# configured randomness source there); the native editor enables this feature
# and the web build defers the trail to the server continuation.
chisel-audit = { workspace = true, optional = true }

[features]
trail = ["dep:chisel-audit"]
