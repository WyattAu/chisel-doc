# platform pin: the tamper-evident trail for applied redactions. Feature-
# gated on wasm32 pending the tamper-audit-side uuid randomness-source
# story (getrandom 0.3/0.4 target tables do not propagate their wasm rng
# features through feature unification on uuid 1.26.1 - investigated
# 2026-10-18; see the chisel-fork-plan notes). Native builds enable it.
chisel-audit = { workspace = true, optional = true }

[features]
trail = ["dep:chisel-audit"]
