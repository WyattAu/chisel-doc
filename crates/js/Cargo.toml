[package]
name = "pdfcraft-js"
description = "Acrobat JavaScript: a sandboxed interpreter (boa) with the form object model subset (event, getField, app, util, console)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
script-gate-kit = { git = "https://github.com/WyattAu/chisel-platform", rev = "93dc6c3cb4f10c33fb6c174ac1ccbe69a4472490" }
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b", "js"] }
