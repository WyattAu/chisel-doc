# cargo-deny policy (M0.4). Run with `cargo xtask deny`; part of `cargo xtask ci`.
# Code dependencies follow the same rule as assets (AGENTS.md): permissive licences only.
# Copyleft (GPL, AGPL, LGPL) is never linked; such tools run only as external oracle processes.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared UI components and spooler; Cargo.toml pins the immutable revision. craft-print pins
# storytold's winprint fork (Windows printing, #1107) to an immutable revision of its own.
# chisel-platform: the fork's own platform repo (tamper-evident document trail);
# pinned by rev in the workspace, verified by the estate gate on chisel-platform.
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/winprint.rs", "https://github.com/WyattAu/chisel-platform"]

[advisories]
yanked = "warn"
ignore = [
    # zstd 0.13 timing/decompression advisories (fixes are 0.14.3/8.2.0-only; cas-kit 1.0.0
    # still pins zstd ^0.13, so no fixed version exists through the dependency). The exposure
    # is local-only: CAS blobs are written by the app into a user-private directory, decode
    # is bounded by cas-kit's MAX_DECOMPRESSED_SIZE, and the decode path is not fed from the
    # network. Tracks the cas-kit zstd 0.14 bump.
    { id = "RUSTSEC-2026-0391", reason = "zstd timing/decompression issues; cas-kit 1.0.0 still pins ^0.13 — decode path is local-only and size-bounded" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe non-constant-time ops; same cas-kit ^0.13 pin — local-only decode path, size-bounded" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe mask generation; same cas-kit ^0.13 pin — local-only decode path, size-bounded" },
    # Marvin (RSA private-key timing side channel, no fixed `rsa` release). pdfcraft-sign uses
    # `rsa` only for public-key signature verification, which the advisory does not affect; RSA
    # private-key operations use aws-lc-rs on native targets and are refused in the browser
    # (ADR-0009). Revisit when a fixed `rsa` ships.
    # The Linux accessibility (AT-SPI) stack is unmaintained upstream (no known
    # vulnerability in the pinned line). It arrives only through accesskit_unix ->
    # accesskit_winit -> egui-winit for screen readers, and crates/platform pins
    # zbus =5.19.0 exactly (deliberate; see the comment there). Revisit when
    # accesskit_unix moves to a maintained zbus release.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (a11y path; zbus pinned =5.19.0)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (a11y path; zbus pinned =5.19.0)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (a11y path; zbus pinned =5.19.0)" },
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for verification only (ADR-0009)" },
    # proc-macro-error is unmaintained (no vulnerability). It reaches the tree as a proc macro of
    # winprint's fmt-derive (craft-print's Windows spooler), so it runs at compile time on Windows
    # and is not in the binary.
    { id = "RUSTSEC-2024-0370", reason = "compile-time proc macro of winprint's fmt-derive (craft-print Windows printing, #1107)" },
]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences on the AGENTS.md
# §1.2 allowlist, attributed in ATTRIBUTION.toml as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# winprint (craft-print's Windows spooler, #1107) lists reqwest as a build-dependency for its
# PDFium download, which only runs with its `pdfium` feature; craft-print turns that off. The CA
# bundle reqwest brings is CDLA-Permissive-2.0 data and is compiled into winprint's build script
# only, never into PdfCraft. Remove when winprint makes those build-dependencies optional.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
